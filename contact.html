<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact MediGuide</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="nav container" id="nav"></nav></header><main><section class="page-hero"><div class="container"><span class="eyebrow">We’re here to help</span><h1>Contact MediGuide</h1><p>Have feedback or a question? Send us a message.</p></div></section><section class="section"><form class="form-card" id="contactForm"><div id="formMessage" class="message"></div><div class="form-grid"><div class="field"><label for="name">Full Name</label><input id="name" name="name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field full"><label for="subject">Subject</label><input id="subject" name="subject" required></div><div class="field full"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div></div><button class="btn btn-primary" type="submit">Send Message</button></form></section></main><footer></footer><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
